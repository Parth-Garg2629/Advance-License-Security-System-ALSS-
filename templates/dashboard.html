{% extends "base.html" %}
{% block content %}

<div class="grid grid-cols-1 xl:grid-cols-2 gap-6 h-[520px]">

    <!-- ================= ACTIVE LICENSES ================= -->
    <div class="flex flex-col bg-surface-dark border border-border-dark rounded-xl shadow-xl overflow-hidden h-full">
        <div class="px-5 py-4 border-b border-border-dark flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-primary">verified</span>
                <h3 class="text-primary font-bold">Active Licenses</h3>
            </div>
            <span id="license-count" class="text-xs text-text-muted font-mono">—</span>
        </div>

        <div class="flex-1 overflow-auto">
            <table class="w-full text-sm">
                <thead class="bg-surface-light sticky top-0">
                    <tr class="text-xs uppercase text-text-muted">
                        <th class="px-4 py-3">License</th>
                        <th class="px-4 py-3">Status</th>
                        <th class="px-4 py-3">Created</th>
                    </tr>
                </thead>
                <tbody id="licenses-table">
                    <tr>
                        <td colspan="3" class="p-6 text-center text-text-muted">
                            Loading licenses…
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ================= DEVICES UNDER REVIEW ================= -->
    <div class="flex flex-col bg-surface-dark border border-border-dark rounded-xl shadow-xl overflow-hidden h-full">
        <div class="px-5 py-4 border-b border-border-dark flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-primary">pattern</span>
                <h3 class="text-primary font-bold">Devices Under Review</h3>
            </div>
            <span id="device-count" class="text-xs text-text-muted font-mono">—</span>
        </div>

        <div class="flex-1 overflow-auto">
            <table class="w-full text-sm">
                <thead class="bg-surface-light sticky top-0">
                    <tr class="text-xs uppercase text-text-muted">
                        <th class="px-4 py-3">Device</th>
                        <th class="px-4 py-3">OS</th>
                        <th class="px-4 py-3">Status</th>
                        <th class="px-4 py-3">Last Seen</th>
                    </tr>
                </thead>
                <tbody id="devices-table">
                    <tr>
                        <td colspan="4" class="p-6 text-center text-text-muted">
                            Loading devices…
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<!-- ================= AUDIT LOGS ================= -->
<div class="mt-6 bg-surface-dark border border-border-dark rounded-xl shadow-xl overflow-hidden min-h-[380px]">
    <div class="px-5 py-4 border-b border-border-dark flex items-center gap-2">
        <span class="material-symbols-outlined text-primary">gavel</span>
        <h3 class="text-primary font-bold">Recent Critical Audit Events</h3>
    </div>

    <div class="overflow-auto">
        <table class="w-full text-sm">
            <thead class="bg-surface-light sticky top-0">
                <tr class="text-xs uppercase text-text-muted">
                    <th class="px-4 py-3">Time</th>
                    <th class="px-4 py-3">Event</th>
                    <th class="px-4 py-3">Status</th>
                    <th class="px-4 py-3">Message</th>
                </tr>
            </thead>
            <tbody id="audit-table">
                <tr>
                    <td colspan="4" class="p-6 text-center text-text-muted">
                        Loading audit events…
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", loadDashboard);

function loadDashboard() {
    loadLicenses();
    loadDevices();
    loadAuditLogs();
}

/* ================= LICENSES ================= */
async function loadLicenses() {
    try {
        const res = await authFetch("/admin/api/dashboard/licenses");
        if (!res || !res.ok) throw new Error();

        const licenses = await res.json();
        const tbody = document.getElementById("licenses-table");
        const counter = document.getElementById("license-count");
        tbody.innerHTML = "";

        counter.innerText = `${licenses.length} active`;

        if (!licenses.length) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="3" class="p-6 text-center text-text-muted">
                        No active licenses
                    </td>
                </tr>`;
            return;
        }

        licenses.forEach(l => {
            tbody.innerHTML += `
                <tr class="hover:bg-surface-light">
                    <td class="px-4 py-3 font-mono text-primary">${l.key}</td>
                    <td class="px-4 py-3">
                        <span class="px-2 py-1 text-xs rounded border border-primary text-primary">
                            ACTIVE
                        </span>
                    </td>
                    <td class="px-4 py-3 text-text-muted">
                        ${l.created_at}
                    </td>
                </tr>`;
        });
    } catch {
        document.getElementById("licenses-table").innerHTML = `
            <tr>
                <td colspan="3" class="p-6 text-center text-danger">
                    Failed to load licenses
                </td>
            </tr>`;
    }
}

/* ================= DEVICES ================= */
async function loadDevices() {
    try {
        const res = await authFetch("/admin/api/devices");
        if (!res || !res.ok) throw new Error();

        const devices = await res.json();
        const tbody = document.getElementById("devices-table");
        const counter = document.getElementById("device-count");
        tbody.innerHTML = "";

        const flagged = devices.filter(d => d.status !== "ACTIVE");
        counter.innerText = `${flagged.length} flagged`;

        if (!flagged.length) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="4" class="p-6 text-center text-text-muted">
                        No devices under review
                    </td>
                </tr>`;
            return;
        }

        flagged.forEach(d => {
            let lastSeen = "—";
            if (d.last_seen) {
                const parsed = new Date(d.last_seen);
                if (!isNaN(parsed.getTime())) {
                    lastSeen = parsed.toLocaleString("en-IN");
                }
            }

            tbody.innerHTML += `
                <tr class="hover:bg-surface-light">
                    <td class="px-4 py-3 font-mono text-primary">${d.fingerprint}</td>
                    <td class="px-4 py-3">${d.os_name || "—"}</td>
                    <td class="px-4 py-3">
                        <span class="px-2 py-1 text-xs rounded border border-warning text-warning">
                            ${d.status}
                        </span>
                    </td>
                    <td class="px-4 py-3 text-text-muted">
                        ${lastSeen}
                    </td>
                </tr>`;
        });
    } catch {
        document.getElementById("devices-table").innerHTML = `
            <tr>
                <td colspan="4" class="p-6 text-center text-danger">
                    Failed to load devices
                </td>
            </tr>`;
    }
}

/* ================= AUDIT LOGS ================= */
async function loadAuditLogs() {
    try {
        const res = await authFetch("/admin/api/dashboard/audit");
        if (!res || !res.ok) throw new Error();

        const logs = await res.json();
        const tbody = document.getElementById("audit-table");
        tbody.innerHTML = "";

        if (!logs.length) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="4" class="p-6 text-center text-text-muted">
                        No audit events
                    </td>
                </tr>`;
            return;
        }

        logs.forEach(log => {
            const success = log.status === "success";

            tbody.innerHTML += `
                <tr class="hover:bg-surface-light">
                    <td class="px-4 py-3 font-mono text-text-muted">
                        ${log.time}
                    </td>
                    <td class="px-4 py-3 text-primary">
                        ${log.event}
                    </td>
                    <td class="px-4 py-3">
                        <span class="px-2 py-1 text-xs rounded border ${
                            success
                                ? "border-emerald-500 text-emerald-400"
                                : "border-red-500 text-red-400"
                        }">
                            ${success ? "SUCCESS" : "FAILED"}
                        </span>
                    </td>
                    <td class="px-4 py-3 text-text-muted">
                        ${log.message || "—"}
                    </td>
                </tr>`;
        });
    } catch {
        document.getElementById("audit-table").innerHTML = `
            <tr>
                <td colspan="4" class="p-6 text-center text-danger">
                    Failed to load audit logs
                </td>
            </tr>`;
    }
}
</script>

{% endblock %}
